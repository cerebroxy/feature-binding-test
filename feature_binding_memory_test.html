<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature Binding Memory Test</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#fff;padding:28px;max-width:700px;width:90%;border-radius:14px;box-shadow:0 4px 20px #0002;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,80px);gap:12px;justify-content:center;margin:25px}.cell{width:80px;height:80px;display:grid;place-items:center}.shape{width:48px;height:48px}.circle{border-radius:50%}.square{border-radius:5px}.triangle{width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-bottom:48px solid currentColor}.diamond{transform:rotate(45deg);width:38px;height:38px}.btn{padding:12px 25px;margin:7px;font-size:17px;border:1px solid #aaa;border-radius:8px;background:white;cursor:pointer}.score{font-size:46px;font-weight:bold}.small{font-size:13px;color:#666}</style></head><body><div class="card" id="app"></div><script>
const C=[['Red','#e53935'],['Blue','#1e88e5'],['Green','#43a047'],['Yellow','#fbc02d'],['Purple','#8e24aa'],['Orange','#fb8c00']];
const S=['circle','square','triangle','diamond'];let trials=[],i=0,score=0,v1=[0,0],v2=[0,0],rt=[],t0;
const app=document.getElementById('app');const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shape(x){let [n,col]=x.color;let s=x.shape;if(s==='triangle')return `<div class="triangle" style="color:${col}"></div>`;return `<div class="shape ${s}" style="background:${col}"></div>`}
function make(type){let count=type===1?6:4, items=[], used=new Set();for(let p=0;p<count;p++){let c,s,k;do{c=rnd(C);s=rnd(S);k=c[0]+'-'+s}while(used.has(k));used.add(k);items.push({color:c,shape:s,pos:p})}let match=Math.random()<.5, probe;if(match){probe={...rnd(items)} }else{let b=rnd(items);let c=rnd(C);while(c[0]===b.color[0])c=rnd(C);let s=rnd(S);while(s===b.shape)s=rnd(S);probe={color:c,shape:s,pos:b.pos};if(type===2&&Math.random()<.4){probe.pos=(b.pos+1+Math.floor(Math.random()*(count-1)))%count}}return{type,items,probe,match}}
function intro(){app.innerHTML=`<h1>Feature-Binding Memory Test</h1><p>You will briefly see colored shapes. After a short delay, decide whether the probe is exactly the same as an item you saw.</p><p>This task measures memory for <b>bound features</b> (color + shape, and color + shape + location).</p><button class="btn" onclick="start()">Start practice</button><p class="small">No personal information is collected. This is a research task, not a clinical or intelligence test.</p>`}
let practice=[];function start(){practice=[make(1),make(2)];practiceRun(0)}function practiceRun(j){if(j>=practice.length){mainIntro();return}trial(practice[j],()=>practiceRun(j+1),true)}
function mainIntro(){app.innerHTML=`<h2>Main Test</h2><p>64 trials. Work at a comfortable pace and answer accurately.</p><button class="btn" onclick="begin()">Begin</button>`}
function begin(){trials=[];for(let j=0;j<32;j++)trials.push(make(1),make(2));i=0;score=0;v1=[0,0];v2=[0,0];rt=[];next()}
function trial(x,done,isPractice=false){let cols=x.type===1?3:2, rows=x.type===1?3:2;let html=`<p>Remember these items</p><div class="grid" style="grid-template-columns:repeat(${cols},80px)">`;for(let p=0;p<x.items.length;p++){let q=x.items[p];html+=`<div class="cell">${shape(q)}</div>`}html+=`</div>`;app.innerHTML=html;setTimeout(()=>{app.innerHTML='<div style="font-size:45px">+</div>';setTimeout(()=>probe(x,done,isPractice),900)},1800)}
function probe(x,done,isPractice){let cols=x.type===1?3:2,html=`<p>Was this <b>exactly the same</b> as one of the items you saw?</p><div class="grid" style="grid-template-columns:repeat(${cols},80px)">`;for(let p=0;p<x.items.length;p++)html+=`<div class="cell">${p===x.probe.pos?shape(x.probe):''}</div>`;html+=`</div><button class="btn" onclick="ans(true)">YES</button><button class="btn" onclick="ans(false)">NO</button>`;app.innerHTML=html;t0=performance.now();window.ans=function(a){let ok=a===x.match;if(isPractice){app.innerHTML=`<h2>${ok?'Correct':'Not quite'}</h2><button class="btn" onclick="donePractice()">Continue</button>`;window.donePractice=done;return}score+=ok?1:0;rt.push(performance.now()-t0);if(x.type===1){v1[1]++;if(ok)v1[0]++}else{v2[1]++;if(ok)v2[0]++}i++;if(i<trials.length)next();else results()}}
function next(){trial(trials[i],()=>{},false)}
function results(){let overall=score/trials.length*100,a=v1[0]/v1[1]*100,b=v2[0]/v2[1]*100,m=rt.reduce((x,y)=>x+y,0)/rt.length;app.innerHTML=`<h1>Test complete</h1><div class="score">${overall.toFixed(1)}%</div><p>Overall accuracy</p><hr><p>Color + shape: <b>${a.toFixed(1)}%</b></p><p>Color + shape + location: <b>${b.toFixed(1)}%</b></p><p>Mean response time: <b>${Math.round(m)} ms</b></p><button class="btn" onclick="copy()">Copy results</button><button class="btn" onclick="intro()">Restart</button><p class="small">For research, use accuracy as the primary score. This custom task is not a normed diagnostic test.</p>`;window.copy=()=>navigator.clipboard?.writeText(`Overall accuracy: ${overall.toFixed(1)}%\nColor + shape accuracy: ${a.toFixed(1)}%\nColor + shape + location accuracy: ${b.toFixed(1)}%\nMean response time: ${Math.round(m)} ms`)}intro();
</script></body></html>
